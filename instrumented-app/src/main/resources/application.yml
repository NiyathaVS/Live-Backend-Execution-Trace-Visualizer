spring:
  application:
    name: instrumented-app

trace:
  enabled: true
  # Maximum number of traces to keep in memory (LRU eviction when exceeded)
  max-traces: 1000
  # Trace retention time in seconds (0 = unlimited)
  ttl-seconds: 3600
  # Sampling configuration: 'all', 'slow' (>500ms), or percentage (e.g., '10' for 10%)
  sampling: all
  # A single method/span taking longer than this is flagged slowPath=true.
  # For a synchronous HTTP service, 100ms per-span is a reasonable signal.
  slow-threshold-ms: 100
  sql:
    # A SQL query taking longer than this is flagged slowQuery=true.
    slow-threshold-ms: 200
  persistence:
    dir: ./trace-data
    retention-days: 7
  # Sensitive data redaction (passwords, tokens, API keys, PII)
  redaction:
    enabled: true
  # WebSocket configuration
  websocket:
    # Allowed origins for WebSocket connections (comma-separated)
    # For production, set this to your frontend domain(s)
    # Example: "https://myapp.com,https://api.myapp.com"
    allowed-origins: "http://localhost:3000,http://localhost:5173"
    # Shared secret for WebSocket authentication.
    # "none" (default) disables auth — safe for local development.
    # In production: set to a strong random string here or via the
    # TRACE_WS_AUTH_TOKEN environment variable.
    # The frontend must connect with: ws://host/ws/traces?token=<secret>
    auth-token: "none"
  alerts:
    slow-request-ms: 1000
    max-error-nodes: 0
    error-rate-threshold: 0.25
